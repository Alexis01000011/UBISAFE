name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ubisafe_app
        run: flutter pub get

      - name: Analyze
        working-directory: ubisafe_app
        run: flutter analyze

      - name: Test
        working-directory: ubisafe_app
        run: flutter test

  fastapi:
    name: FastAPI — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ubisafe_api
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: ubisafe_api
        run: ruff check . --fix

      - name: Test (pytest)
        working-directory: ubisafe_api
        run: pytest --tb=short

  build-apk:
    name: Flutter — build APK
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ubisafe_app
        run: flutter pub get

      - name: Inject Maps API key
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> ubisafe_app/android/local.properties

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > ubisafe_app/android/app/google-services.json

      - name: Build APK
        working-directory: ubisafe_app
        run: flutter build apk --release --dart-define=API_BASE_URL=https://ubisafe-j1fg.onrender.com

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubisafe-apk
          path: ubisafe_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
