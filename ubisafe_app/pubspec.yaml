name: ubisafe_app
description: UBISAFE — Urban Safety Mobile App (modular monolith architecture)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────────────────────────
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.2.2

  # ── Firebase RTDB ─────────────────────────────────────────────────────────
  firebase_database: ^10.4.0

  # ── State management (Riverpod) ──────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^13.2.0

  # ── HTTP / FastAPI client ─────────────────────────────────────────────────
  dio: ^5.4.0

  # ── Maps ─────────────────────────────────────────────────────────────────
  google_maps_flutter: ^2.5.3

  # ── Location / GPS ───────────────────────────────────────────────────────
  geolocator: ^10.1.0

  # ── UI extras ────────────────────────────────────────────────────────────
  flutter_speed_dial: ^7.0.0

  # ── Typography ───────────────────────────────────────────────────────────
  google_fonts: ^6.2.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
