services:
  - type: web
    name: ubisafe-api
    runtime: docker
    dockerfilePath: ./ubisafe_api/Dockerfile
    dockerContext: ./ubisafe_api
    healthCheckPath: /auth/health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: ubisafe-ca262
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
